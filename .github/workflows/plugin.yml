# Builds and tests Griddy on every push. The macOS job is the important one:
# it compiles the AVFoundation camera and recorder code and the AU, which
# can't be built on Linux, and runs Apple's own AU validator (auval).
# The plugin lives in plugin/, so every step runs there.
name: plugin

on:
  push:
    paths: ["plugin/**", ".github/workflows/plugin.yml"]
  pull_request:
    paths: ["plugin/**", ".github/workflows/plugin.yml"]

defaults:
  run:
    working-directory: plugin

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Ninja
        run: brew install ninja || true

      - name: Build the web UI
        working-directory: plugin/ui
        run: npm ci && npm run build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, AU, Standalone and tests
        run: cmake --build build --parallel

      - name: Engine unit tests
        run: ./build/GriddyTests_artefacts/Release/GriddyTests

      - name: Fake DAW smoke test (loads the VST3)
        run: ./build/GriddyHostSmokeTest_artefacts/Release/GriddyHostSmokeTest build/Griddy_artefacts/Release/VST3/Griddy.vst3

      - name: Crash report (only if the smoke test failed)
        if: failure()
        run: |
          sleep 5
          for f in ~/Library/Logs/DiagnosticReports/GriddyHostSmokeTest*; do echo "=== $f"; head -c 12000 "$f"; done || true

      # Real time timing checks on shared CI runners are noisy (2 to 4 shared cores), so this step
      # reports numbers and is not a gate. The unit tests and the smoke test are the gate.
      - name: Engine harness (real time scenarios, 60 second soak)
        continue-on-error: true
        run: |
          ./build/GriddyHarness_artefacts/Release/GriddyHarness
          ./build/GriddyHarness_artefacts/Release/GriddyHarness soak --soak-seconds 60 --soak-720

      - name: Apple AU validation
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Griddy_artefacts/Release/AU/Griddy.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Grdy Pkag

      - name: Fake DAW smoke test (loads the VST3)
        if: ${{ !cancelled() }}
        run: ./build/GriddyHostSmokeTest_artefacts/Release/GriddyHostSmokeTest build/Griddy_artefacts/Release/VST3/Griddy.vst3

      - name: Backtrace, if the smoke test crashed
        if: failure()
        run: |
          lldb --batch -o run -k "bt all" -k quit -- \
            ./build/GriddyHostSmokeTest_artefacts/Release/GriddyHostSmokeTest build/Griddy_artefacts/Release/VST3/Griddy.vst3 \
            2>&1 | tail -n 300

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Griddy-macOS-unsigned
          path: |
            plugin/build/Griddy_artefacts/Release/VST3/Griddy.vst3
            plugin/build/Griddy_artefacts/Release/AU/Griddy.component
            plugin/build/Griddy_artefacts/Release/Standalone/Griddy.app

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libgtk-3-dev libglu1-mesa-dev xvfb

      - name: Build the web UI
        working-directory: plugin/ui
        run: npm ci && npm run build

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Tests
        run: |
          ./build/GriddyTests_artefacts/Release/GriddyTests
          xvfb-run -a ./build/GriddyHostSmokeTest_artefacts/Release/GriddyHostSmokeTest build/Griddy_artefacts/Release/VST3/Griddy.vst3

      # Real time timing checks on shared CI runners are noisy (2 to 4 shared cores), so this step
      # reports numbers and is not a gate. The unit tests and the smoke test are the gate.
      - name: Engine harness (real time scenarios, 60 second soak)
        continue-on-error: true
        run: |
          xvfb-run -a ./build/GriddyHarness_artefacts/Release/GriddyHarness
          xvfb-run -a ./build/GriddyHarness_artefacts/Release/GriddyHarness soak --soak-seconds 60 --soak-720
